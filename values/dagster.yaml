# ==============================================================================
# Finsights Platform Deployment - Dagster Values
# Orchestration, AI Pipelines, and Data Processing
# Connected to Shared PostgreSQL Tools Database in finsights-platform namespace
# ==============================================================================

global:
  postgresqlSecretName: "dagster-admin-postgresql-secret"
  dagsterHome: "/opt/dagster/dagster_home"
  serviceAccountName: ""

# ------------------------------------------------------------------------------
# PostgreSQL Connection (Using Shared PostgreSQL in finsights-platform)
# CoreDB syncs DAGSTER_DB_PASSWORD to dagster-admin-postgresql-secret.
# ------------------------------------------------------------------------------
postgresql:
  enabled: false
  postgresqlHost: "postgresql.finsights-platform.svc.cluster.local"
  postgresqlUsername: "dagster_admin"
  postgresqlPassword: ""
  postgresqlDatabase: "dagster"
  service:
    port: 5432

generatePostgresqlPasswordSecret: false

# ------------------------------------------------------------------------------
# Telemetry
# ------------------------------------------------------------------------------
telemetry:
  enabled: false

# ------------------------------------------------------------------------------
# Dagster Webserver (Web UI & GraphQL API)
# ------------------------------------------------------------------------------
dagsterWebserver:
  replicaCount: 1
  service:
    type: NodePort
    port: 80
    nodePort: 31882
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ------------------------------------------------------------------------------
# Ingress Configuration (Ingress-Nginx)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  ingressClassName: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
  dagsterWebserver:
    host: "dagster.finsights.biz"
    path: "/"
    pathType: "Prefix"

# ------------------------------------------------------------------------------
# Dagster Daemon (Schedules, Sensors, Run Queue)
# ------------------------------------------------------------------------------
dagsterDaemon:
  enabled: true
  runMonitoring:
    enabled: true
    startTimeoutSeconds: 120
    pollIntervalSeconds: 30
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ------------------------------------------------------------------------------
# Run Launcher (Kubernetes Native Job Execution)
# ------------------------------------------------------------------------------
runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      jobNamespace: "orchestration"
      loadInclusterConfig: true
      imagePullPolicy: "Always"
      envSecrets:
        - name: "dagster-pipeline-secrets"
        - name: "oci-object-storage-credentials"
      volumes:
        - name: ca-certs
          configMap:
            name: mysql-ca-certificates
      volumeMounts:
        - name: ca-certs
          mountPath: /opt/dagster/certs
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

# ------------------------------------------------------------------------------
# User Code Deployments (AI Services & Scraping Pipelines Repository)
# ------------------------------------------------------------------------------
dagster-user-deployments:
  enabled: true
  enableSubchart: true
  deployments:
    - name: "finsights-data-scraping"
      image:
        repository: "ghcr.io/minhphu05/fingsights-data-scraping"
        tag: "latest"
        pullPolicy: Always
      dagsterApiGrpcArgs:
        - "-h"
        - "0.0.0.0"
        - "-p"
        - "3030"
        - "-m"
        - "src.finsights_scraping.orchestration.definitions"
      port: 3030
      volumeMounts:
        - name: ca-certs
          mountPath: /opt/dagster/certs
          readOnly: true
      volumes:
        - name: ca-certs
          configMap:
            name: mysql-ca-certificates
      env:
        - name: ORACLE_MYSQL_BACKEND_HOST
          value: "161.33.181.173"
        - name: ORACLE_MYSQL_BACKEND_PORT
          value: "3306"
        - name: ORACLE_MYSQL_AI_HOST
          value: "129.221.137.201"
        - name: ORACLE_MYSQL_AI_PORT
          value: "3306"
        - name: NEWS_DATABASE_URL
          value: "mysql+pymysql://finsights_news_app:$(MYSQL_NEWS_APP_PASSWORD)@161.33.181.173:3306/finsights_news?charset=utf8mb4"
        - name: MARKET_DATABASE_URL
          value: "mysql+pymysql://finsights_market_app:$(MYSQL_MARKET_APP_PASSWORD)@161.33.181.173:3306/finsights_market?charset=utf8mb4"
        - name: SCRAPING_DATABASE_URL
          value: "mysql+pymysql://finsights_scraping_app:$(MYSQL_SCRAPING_APP_PASSWORD)@129.221.137.201:3306/finsights_scraping?charset=utf8mb4"
        - name: MYSQL_NODE_1_TLS_CA_FILE
          value: "/opt/dagster/certs/mysql-node-1-ca.pem"
        - name: MYSQL_NODE_2_TLS_CA_FILE
          value: "/opt/dagster/certs/mysql-node-2-ca.pem"
        - name: ENABLE_OCI_MEDIA_UPLOAD
          value: "true"
      envSecrets:
        - name: "dagster-pipeline-secrets"
        - name: "oci-object-storage-credentials"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi

    - name: "finsights-ai-pipelines"
      image:
        repository: "docker.io/dagster/user-code-example"
        tag: "1.13.27"
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs:
        - "-f"
        - "/opt/dagster/app/repo.py"
      port: 3030
      volumeMounts:
        - name: pipeline-code
          mountPath: /opt/dagster/app/repo.py
          subPath: repo.py
      volumes:
        - name: pipeline-code
          configMap:
            name: finsights-pipeline-code
      env:
        # Oracle Cloud Account 1 (Tokyo): Backend Core Database Endpoint
        - name: ORACLE_MYSQL_BACKEND_HOST
          value: "161.33.181.173"
        - name: ORACLE_MYSQL_BACKEND_PORT
          value: "3306"
        # Oracle Cloud Account 2 (Singapore): AI Services & Financial Analytics DB Endpoint
        - name: ORACLE_MYSQL_AI_HOST
          value: "129.221.137.201"
        - name: ORACLE_MYSQL_AI_PORT
          value: "3306"
        # In-Cluster Redis HA Cache Endpoint
        - name: REDIS_HOST
          value: "redis-master.finsights-platform.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
      # Passwords injected securely from pre-existing K3s secret
      envSecrets:
        - name: "dagster-pipeline-secrets"
      resources:
        requests:
          cpu: 150m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 1Gi

# ------------------------------------------------------------------------------
# Extra Manifests: Working Pipeline Definitions & CA Certificates ConfigMap
# ------------------------------------------------------------------------------
extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: finsights-pipeline-code
    data:
      repo.py: |
        import dagster as dg

        @dg.asset
        def finsights_core_health(context: dg.AssetExecutionContext) -> None:
            context.log.info("Finsights core data pipeline is healthy and active!")

        defs = dg.Definitions(assets=[finsights_core_health])


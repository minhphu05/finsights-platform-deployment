# ==============================================================================
# Finsights Platform Deployment - Dagster Values
# Orchestration, AI Pipelines, and Data Processing
# Connected to Shared PostgreSQL Tools Database in finsights-platform namespace
# ==============================================================================

global:
  postgresqlSecretName: "dagster-admin-postgresql-secret"
  dagsterHome: "/opt/dagster/dagster_home"
  serviceAccountName: ""

# ------------------------------------------------------------------------------
# PostgreSQL Connection (Using Shared PostgreSQL in finsights-platform)
# CoreDB syncs DAGSTER_DB_PASSWORD to dagster-admin-postgresql-secret.
# ------------------------------------------------------------------------------
postgresql:
  enabled: false
  postgresqlHost: "postgresql.finsights-platform.svc.cluster.local"
  postgresqlUsername: "dagster_admin"
  postgresqlPassword: ""
  postgresqlDatabase: "dagster"
  service:
    port: 5432

generatePostgresqlPasswordSecret: false

# ------------------------------------------------------------------------------
# Telemetry
# ------------------------------------------------------------------------------
telemetry:
  enabled: false

# ------------------------------------------------------------------------------
# Dagster Webserver (Web UI & GraphQL API)
# ------------------------------------------------------------------------------
dagsterWebserver:
  replicaCount: 1
  service:
    type: NodePort
    port: 80
    nodePort: 31882
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ------------------------------------------------------------------------------
# Ingress Configuration (Ingress-Nginx)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  ingressClassName: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
  dagsterWebserver:
    host: "dagster.finsights.biz"
    path: "/"
    pathType: "Prefix"

# ------------------------------------------------------------------------------
# Dagster Daemon (Schedules, Sensors, Run Queue)
# ------------------------------------------------------------------------------
dagsterDaemon:
  enabled: true
  runMonitoring:
    enabled: true
    startTimeoutSeconds: 120
    pollIntervalSeconds: 30
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ------------------------------------------------------------------------------
# Run Launcher (Kubernetes Native Job Execution)
# ------------------------------------------------------------------------------
runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      jobNamespace: "orchestration"
      loadInclusterConfig: true
      imagePullPolicy: "Always"
      failPodOnRunFailure: false
      runK8sConfig:
        jobSpecConfig:
          ttlSecondsAfterFinished: 86400
      envSecrets:
        - name: "dagster-pipeline-secrets"
        - name: "oci-object-storage-credentials"
        - name: "finsights-embeddings-postgresql-secret"
      envVars:
        - "MYSQL_SOURCE_READONLY_DSN=mysql+aiomysql://finsights_ai_ro@129.221.137.201:3306/finsights_news?charset=utf8mb4"
        - "MYSQL_SOURCE_TLS_CA=/opt/dagster/certs/mysql-node-2-ca.pem"
        - "MYSQL_TLS=true"
        - "MYSQL_TLS_SERVER_NAME=MySQL_Endpoint_Server"
        - "POSTGRES_RAG_DSN=postgresql+psycopg://finsights_embeddings_app@postgresql.finsights-platform.svc.cluster.local:5432/finsights_embeddings?sslmode=prefer"
        - "CLOUDFLARE_ACCOUNT_ID=0fa8bb51f0c7cbecf930dbfade8287c2"
      volumes:
        - name: ca-certs
          configMap:
            name: mysql-ca-certificates
      volumeMounts:
        - name: ca-certs
          mountPath: /opt/dagster/certs
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

# ------------------------------------------------------------------------------
# User Code Deployments (AI Services & Scraping Pipelines Repository)
# ------------------------------------------------------------------------------
dagster-user-deployments:
  enabled: true
  enableSubchart: true
  deployments:
    - name: "finsights-data-scraping"
      image:
        repository: "ghcr.io/minhphu05/fingsights-data-scraping"
        tag: "latest"
        pullPolicy: Always
      dagsterApiGrpcArgs:
        - "-h"
        - "0.0.0.0"
        - "-p"
        - "3030"
        - "-m"
        - "src.finsights_scraping.orchestration.definitions"
      port: 3030
      volumeMounts:
        - name: ca-certs
          mountPath: /opt/dagster/certs
          readOnly: true
      volumes:
        - name: ca-certs
          configMap:
            name: mysql-ca-certificates
      env:
        - name: ORACLE_MYSQL_BACKEND_HOST
          value: "129.221.137.201"
        - name: ORACLE_MYSQL_BACKEND_PORT
          value: "3306"
        - name: MARKET_DATABASE_URL
          value: "mysql+pymysql://finsights_market_data_app:$(MYSQL_SCRAPING_APP_PASSWORD)@129.221.137.201:3306/finsights_market_data?charset=utf8mb4"
        - name: NEWS_DATABASE_URL
          value: "mysql+pymysql://finsights_news_app:$(MYSQL_NEWS_APP_PASSWORD)@129.221.137.201:3306/finsights_news?charset=utf8mb4"
        - name: SCRAPING_DATABASE_URL
          value: "mysql+pymysql://finsights_scraping_app:$(MYSQL_SCRAPING_APP_PASSWORD)@129.221.137.201:3306/finsights_scraping?charset=utf8mb4"
        - name: MYSQL_NODE_2_TLS_CA_FILE
          value: "/opt/dagster/certs/mysql-node-2-ca.pem"
        - name: ENABLE_OCI_MEDIA_UPLOAD
          value: "true"
      envSecrets:
        - name: "dagster-pipeline-secrets"
        - name: "oci-object-storage-credentials"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi

    - name: "finsights-ai-pipelines"
      image:
        repository: "ghcr.io/minhphu05/finsights-ai-service"
        tag: "latest"
        pullPolicy: Always
      dagsterApiGrpcArgs:
        - "-m"
        - "orchestration.definitions"
      port: 3030
      volumeMounts:
        - name: ca-certs
          mountPath: /opt/dagster/certs
          readOnly: true
      volumes:
        - name: ca-certs
          configMap:
            name: mysql-ca-certificates
      env:
        - name: MYSQL_SOURCE_READONLY_DSN
          value: "mysql+aiomysql://finsights_ai_ro@129.221.137.201:3306/finsights_news?charset=utf8mb4"
        - name: MYSQL_SOURCE_TLS_CA
          value: "/opt/dagster/certs/mysql-node-2-ca.pem"
        - name: MYSQL_TLS
          value: "true"
        - name: MYSQL_TLS_SERVER_NAME
          value: "MySQL_Endpoint_Server"
        - name: POSTGRES_RAG_DSN
          value: "postgresql+psycopg://finsights_embeddings_app@postgresql.finsights-platform.svc.cluster.local:5432/finsights_embeddings?sslmode=prefer"
        - name: CLOUDFLARE_ACCOUNT_ID
          value: "0fa8bb51f0c7cbecf930dbfade8287c2"
        - name: NEWS_EMBEDDING_MODEL
          value: "@cf/baai/bge-m3"
      envSecrets:
        - name: "dagster-pipeline-secrets"
        - name: "finsights-embeddings-postgresql-secret"
      readinessProbe:
        enabled: true
        timeoutSeconds: 30
        periodSeconds: 20
        failureThreshold: 15
      resources:
        requests:
          cpu: 150m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 1Gi

# ------------------------------------------------------------------------------
# Extra Manifest: MySQL CA certificates used by the scraping and AI pipelines
# ------------------------------------------------------------------------------
extraManifests:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: finsights-ai-api
      namespace: orchestration
      labels:
        app.kubernetes.io/name: finsights-ai-api
        app.kubernetes.io/part-of: finsights-ai-service
    spec:
      replicas: 1
      revisionHistoryLimit: 2
      selector:
        matchLabels:
          app.kubernetes.io/name: finsights-ai-api
      template:
        metadata:
          labels:
            app.kubernetes.io/name: finsights-ai-api
            app.kubernetes.io/part-of: finsights-ai-service
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: provider-keys
              persistentVolumeClaim:
                claimName: finsights-ai-api-provider-keys
          containers:
            - name: ai-api
              image: ghcr.io/minhphu05/finsights-ai-service:api-e05dfdaa3bf0f2f2d1eb14fd9e78e15d6eb7f96e
              imagePullPolicy: IfNotPresent
              ports:
                - name: http
                  containerPort: 8081
              volumeMounts:
                - name: provider-keys
                  mountPath: /opt/finsights-ai-service/data
              env:
                - name: AI_KEYS_FILE
                  value: /opt/finsights-ai-service/data/provider_keys.json
                - name: MYSQL_SOURCE_READONLY_DSN
                  value: "mysql+aiomysql://finsights_ai_ro@129.221.137.201:3306/finsights_news?charset=utf8mb4"
                - name: MYSQL_SOURCE_TLS_CA
                  value: /opt/finsights-ai-service/certs/mysql-node-2-ca.pem
                - name: MYSQL_CHAT_DSN
                  value: "mysql+aiomysql://finsights_ai_app@161.33.181.173:3306/finsights_ai?charset=utf8mb4"
                - name: MYSQL_CHAT_TLS_CA
                  value: /opt/finsights-ai-service/certs/mysql-node-1-ca.pem
                - name: MYSQL_TLS
                  value: "true"
                - name: MYSQL_TLS_SERVER_NAME
                  value: MySQL_Endpoint_Server
                - name: AI_MODELS_FILE
                  value: /opt/finsights-ai-service/configs/models.yaml
                - name: MYSQL_AI_RO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dagster-pipeline-secrets
                      key: MYSQL_AI_RO_PASSWORD
                - name: MYSQL_AI_APP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dagster-pipeline-secrets
                      key: MYSQL_AI_APP_PASSWORD
                      optional: true
                - name: DEEPSEEK_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dagster-pipeline-secrets
                      key: DEEPSEEK_API_KEY
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              startupProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 5
                failureThreshold: 24
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 5
              resources:
                requests:
                  cpu: 150m
                  memory: 384Mi
                limits:
                  cpu: 1
                  memory: 1536Mi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: finsights-ai-api-provider-keys
      namespace: orchestration
      labels:
        app.kubernetes.io/name: finsights-ai-api
        app.kubernetes.io/part-of: finsights-ai-service
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
  - apiVersion: v1
    kind: Service
    metadata:
      name: finsights-ai-api
      namespace: orchestration
      labels:
        app.kubernetes.io/name: finsights-ai-api
        app.kubernetes.io/part-of: finsights-ai-service
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: finsights-ai-api
      ports:
        - name: http
          port: 8081
          targetPort: http
          protocol: TCP
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: finsights-ai-api-ingress
      namespace: orchestration
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: finsights-ai-api
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: finsights-platform
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: finsights-backend
                  app.kubernetes.io/component: api-gateway
          ports:
            - protocol: TCP
              port: 8081
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: mysql-ca-certificates
    data:

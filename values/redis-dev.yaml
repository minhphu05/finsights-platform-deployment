# ==============================================================================
# Finsights Redis Standalone DEV Values
# Mode: Standalone (Minimal RAM & CPU for local / lightweight dev)
# ==============================================================================

architecture: standalone

auth:
  enabled: true
  password: "FinsightsRedisDev2026!"

master:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

metrics:
  enabled: true

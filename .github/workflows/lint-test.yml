name: Lint & Validate Platform Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'values/**'
      - 'applications/**'
      - '.github/workflows/lint-test.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-test:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Lint Charts
        run: |
          echo "Linting Redis Helm chart..."
          helm lint charts/redis

          echo "Linting PostgreSQL Helm chart..."
          helm lint charts/postgresql -f values/postgresql.yaml

          echo "Linting Dagster Helm chart..."
          helm lint charts/dagster -f values/dagster.yaml

      - name: Validate Template Rendering
        run: |
          echo "Testing Redis template rendering with values/redis.yaml..."
          helm template test-redis charts/redis -f values/redis.yaml > /dev/null

          echo "Testing PostgreSQL template rendering with values/postgresql.yaml..."
          helm template test-postgres charts/postgresql -f values/postgresql.yaml --namespace finsights-platform > /dev/null

          echo "Testing Dagster template rendering with values/dagster.yaml..."
          helm template test-dagster charts/dagster -f values/dagster.yaml --namespace orchestration > /dev/null

          echo "✅ All charts linted and templates rendered successfully!"
